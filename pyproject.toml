[project]
name = "rag-study-chatbot"
version = "1.0.0"
description = "A study-only RAG chatbot that answers strictly from your uploaded notes (PDF/DOCX/MD/TXT)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "RAG Study Chatbot" }]
license = { text = "MIT" }

dependencies = [
    # --- Web framework ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # --- Config / utilities ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # --- Document parsing ---
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "markdown>=3.6",
    # --- LangChain ecosystem ---
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    # --- Embeddings + vector store ---
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    # --- Observability ---
    "loguru>=0.7",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------
# Ruff: lightweight linter/formatter config (beginner friendly)
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
